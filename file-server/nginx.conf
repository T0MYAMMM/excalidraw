# Replaces the nginx image's default.conf (mounted by docker-compose.yml):
# serves the built app and forwards /api/ to the file-server container.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://file-server:8080;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }

    # background removal (rembg container); CPU inference can take a while
    location /api/rembg/ {
        proxy_pass http://rembg:7000/;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
