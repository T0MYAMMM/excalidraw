services:
  excalidraw:
    build:
      context: .
      args:
        - NODE_ENV=development
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: unless-stopped
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
    volumes:
      # serves the app and forwards /api/ to file-server
      - ./file-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - file-server

  # Stores drawings as <name>.excalidraw files in DRAWINGS_DIR (default ~/drawings).
  # Create the folder before the first start so it is owned by you, not root.
  file-server:
    image: node:22-alpine
    container_name: excalidraw-files
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      - DATA_DIR=/data
      - PORT=8080
    volumes:
      - ./file-server:/app:ro
      - ${DRAWINGS_DIR:-~/drawings}:/data
